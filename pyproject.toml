[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "career-copilot-fr"
version = "3.0.0"
description = "Copilote universel français de recherche de stages, alternances et jobs étudiants (FastAPI, SQLite WAL, zero-PII)."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Career Copilot Contributors"},
]
dependencies = [
    "beautifulsoup4>=4.15.0",
    "et-xmlfile>=2.0.0",
    "fastapi>=0.115.0",
    "jinja2>=3.1.4",
    "lxml>=6.1.3",
    "openpyxl>=3.1.5",
    "pydantic>=2.9.0",
    "requests>=2.34.2",
    "typing-extensions>=4.16.0",
    "urllib3>=2.8.0",
    "uvicorn[standard]>=0.32.0",
    "weasyprint>=62.0",
]

[project.optional-dependencies]
browser = ["playwright>=1.64.1"]
jobspy = ["python-jobspy>=1.4.1", "pandas>=3.1.1"]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
    "ty>=0.0.1a1",
]

[project.scripts]
career-copilot = "career_copilot.cli:main"
career-copilot-api = "career_copilot.api.app:run_server"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
career_copilot = [
    "web/templates/*.html",
    "web/static/js/*.js",
    "web/static/css/*.css",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP", "SIM", "S", "C90"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106", "S108"]
"bot/tests/**/*.py" = ["S101", "S105", "S106", "S108"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ty.environment]
python-version = "3.12"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["career_copilot"]
branch = true

[tool.coverage.report]
show_missing = true
