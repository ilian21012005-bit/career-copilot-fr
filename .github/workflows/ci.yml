name: Career Copilot CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: career-copilot-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv and sync environment
        run: |
          python -m pip install --upgrade pip uv
          uv sync --dev

      - name: Lint (ruff)
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests

      - name: Type check (ty)
        run: uv run ty check src

      - name: Unit tests (pytest) and shim imports
        env:
          DISABLE_AI: "1"
          AI_LOCAL_ENABLED: "0"
          AI_GEMINI_ENABLED: "0"
          AI_OPENROUTER_ENABLED: "0"
          STANDALONE_CAREER_MODE: "1"
        run: |
          uv run pytest -q
          PYTHONPATH=src:bot uv run python -c "import candidate_config, notifier, runtime_hooks; import career_copilot.cli"

      - name: Standalone zero-PII export leak check
        env:
          DISABLE_AI: "1"
          STANDALONE_CAREER_MODE: "1"
        run: uv run python scripts/verify_oss_export.py --source .
